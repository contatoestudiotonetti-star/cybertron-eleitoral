name: Atualizar apuracao oficial TSE
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cybertron-tse
  cancel-in-progress: false
jobs:
  coletar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar dados oficiais TSE
        run: python scripts/coletar_tse.py
      - name: Publicar snapshot oficial no GitHub Pages
        run: |
          if ! git diff --quiet -- apuracao_tse.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apuracao_tse.json
            git commit -m 'Atualizar apuracao oficial TSE'
            git push
          fi
